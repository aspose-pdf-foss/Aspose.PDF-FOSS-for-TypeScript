<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <style>
    .accent { fill: #2244cc }
    g .viaDescendant { stroke: #cc2222; stroke-width: 2 }
  </style>
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff0000"/>
      <stop offset="1" stop-color="#0000ff"/>
    </linearGradient>
    <radialGradient id="rg">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#008800"/>
    </radialGradient>
    <pattern id="pat" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="5" height="5" fill="#333333"/>
    </pattern>
    <clipPath id="clip">
      <rect x="10" y="110" width="80" height="40"/>
    </clipPath>
    <g id="reused">
      <circle cx="0" cy="0" r="6" fill="#ff8800"/>
    </g>
  </defs>

  <rect x="0" y="0" width="200" height="60" fill="url(#lg)"/>
  <ellipse cx="40" cy="80" rx="30" ry="15" fill="url(#rg)"/>
  <rect x="110" y="65" width="80" height="30" fill="url(#pat)"/>

  <path d="M 10 110 L 50 110 L 50 150 L 10 150 Z" fill="#884400"/>
  <path d="M 60 110 C 70 100, 90 100, 100 110 S 130 130, 140 110"
        fill="none" stroke="#000000" stroke-width="3"/>
  <path d="M 150 110 Q 170 95, 190 110 T 190 140" fill="none" stroke="#0088ff"
        stroke-width="3"/>
  <path d="M 20 160 A 20 20 0 0 1 60 160 A 20 20 0 0 1 20 160 Z" fill="#aa00aa"/>

  <g clip-path="url(#clip)">
    <rect x="0" y="100" width="200" height="60" fill="#00cc00" opacity="0.4"/>
  </g>

  <g transform="translate(120,165) rotate(15) scale(1.5)">
    <use href="#reused"/>
  </g>

  <polygon points="150,150 170,150 160,170" class="accent"/>
  <g>
    <line x1="90" y1="185" x2="140" y2="185" class="viaDescendant"/>
  </g>

  <text x="10" y="195" font-size="12" font-family="serif">Ab<tspan
    font-size="8" dy="-4">cd</tspan></text>
</svg>
